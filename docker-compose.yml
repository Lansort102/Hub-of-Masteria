version: '3.8'

services:
  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masteria-frontend
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - masteria-network
    depends_on:
      - backend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masteria-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - masteria-network
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://masteria_user:change_this_password@db:5432/masteria
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost/api/auth/discord/callback}
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      - db

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: masteria-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - masteria-network
    environment:
      - POSTGRES_DB=masteria
      - POSTGRES_USER=masteria_user
      - POSTGRES_PASSWORD=change_this_password
    ports:
      - "5432:5432"

networks:
  masteria-network:
    driver: bridge

volumes:
  postgres_data:

